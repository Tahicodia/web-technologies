<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <a class="header-link" href="#">Mail</a>
    <a class="header-link" href="#">Images</a>

    <div class="popup-wrapper">
        <input class="popup-toggle" type="checkbox" id="popup-toggle">
        <label class="popup-button" for="popup-toggle">
            <img src="./icons/apps.png" alt="Apps">
        </label>

        <div class="popup">
            <div class="popup-content" tabindex="0">
                <ul class="popup-list">
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Calendar</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Mail</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>News</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Map</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Files</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Contacts</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Translate</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Videos</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Search</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Photo</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Apps</span></a></li>
                    <li><a class="popup-item" href="#"><img src="" alt=""><span>Document</span></a></li>
                </ul>

                <div class="popup-more">
                    <ul class="popup-list">
                        <li><a class="popup-item" href="#"><img src="" alt=""><span>Chat</span></a></li>
                        <li><a class="popup-item" href="#"><img src="" alt=""><span>Classroom</span></a></li>
                        <li><a class="popup-item" href="#"><img src="" alt=""><span>Collection</span></a></li>
                        <li><a class="popup-item" href="#"><img src="" alt=""><span>Mars</span></a></li>
                        <li><a class="popup-item" href="#"><img src="" alt=""><span>Blogs</span></a></li>
                        <li><a class="popup-item" href="#"><img src="" alt=""><span>Promos</span></a></li>
                    </ul>
                    <a class="popup-footer-link" href="#">Even more from Kottans</a>
                </div>
            </div>

            <input class="more-toggle" type="checkbox" id="more-toggle">
            <label class="more-button" for="more-toggle">More</label>
        </div>
    </div>

    <img class="header-icon" src="./icons/notification.png" alt="">
    <img class="header-icon header-avatar" src="./icons/person.png" alt="">
</header>
</body>
</html>
