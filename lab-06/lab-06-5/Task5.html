<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
    <div class="temp">17</div>
</div>

<img class="cloud" src="./img/cloud.png" alt="">

<div class="forecast">
    <div class="day" style="left: 20px"><span>Mon</span>17°</div>
    <div class="day" style="left: 95px"><span>Tue</span>19°</div>
    <div class="day" style="left: 170px"><span>Wed</span>16°</div>
    <div class="day" style="left: 245px"><span>Thu</span>18°</div>
    <div class="day" style="left: 320px"><span>Fri</span>21°</div>
</div>

<div class="arrows">
    <div class="arrow">&larr;</div><div class="arrow">&rarr;</div>
</div>
</body>
</html>
